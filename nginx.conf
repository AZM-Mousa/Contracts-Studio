server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # pdf.js ships ES modules as .mjs.
  types {
    text/javascript mjs;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

  # Hashed bundles and pdf.js assets never change for a given URL.
  location ~* \.(?:js|mjs|css|woff2?|wasm|bcmap|pfb|icc)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths load index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
